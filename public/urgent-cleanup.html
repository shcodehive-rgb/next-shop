<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URGENT PRODUCT DELETION</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .btn { padding: 15px 30px; margin: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .danger { background: #dc2626; color: white; }
        .danger:hover { background: #b91c1c; }
        .warning { background: #f59e0b; color: white; }
        .warning:hover { background: #d97706; }
        .success { background: #10b981; color: white; }
        .success:hover { background: #059669; }
        .alert { background: #fef2f2; border: 1px solid #fecaca; padding: 15px; border-radius: 8px; margin: 10px 0; }
        .result { padding: 10px; margin: 5px 0; border-radius: 4px; }
        .deleted { background: #fee2e2; color: #dc2626; }
        .protected { background: #f0fdf4; color: #16a34a; }
        .error { background: #fef2f2; color: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 URGENT PRODUCT DELETION</h1>
        
        <div class="alert">
            <strong>⚠️ CRITICAL:</strong> This will permanently delete all non-fitness products including:
            <br>• Medical chair for posture correction
            <br>• Electric Cleaning Brush
            <br>• Electric Chopper
            <br>• All other non-fitness products
        </div>

        <div style="text-align: center; margin: 20px 0;">
            <button class="btn warning" onclick="previewDeletion()">📋 Preview What Will Be Deleted</button>
            <button class="btn danger" onclick="executeDeletion()">🗑️ DELETE ALL NON-FITNESS PRODUCTS</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        async function previewDeletion() {
            const results = document.getElementById('results');
            results.innerHTML = '<div style="text-align: center; padding: 20px;">🔄 Analyzing products...</div>';
            
            try {
                const response = await fetch('/api/cleanup-products');
                const data = await response.json();
                
                if (data.success) {
                    let html = `
                        <div style="background: #f0fdf4; padding: 15px; border-radius: 8px; margin: 10px 0;">
                            <h3>📊 CLEANUP PREVIEW</h3>
                            <br><strong>Total Products:</strong> ${data.summary.totalProducts}
                            <br><strong>Protected (Facebook Ads):</strong> ${data.summary.protectedFound}
                            <br><strong>Will Keep (Fitness):</strong> ${data.summary.productsToKeep}
                            <br><strong>Will Delete (Non-Fitness):</strong> ${data.summary.productsToDelete}
                        </div>
                    `;

                    // Show products to delete
                    if (data.details.productsToDelete.length > 0) {
                        html += '<div style="background: #fef2f2; padding: 15px; border-radius: 8px; margin: 10px 0;"><h3>❌ PRODUCTS TO DELETE:</h3>';
                        data.details.productsToDelete.forEach(product => {
                            html += `<div class="result deleted">🗑️ ${product.title}</div>`;
                        });
                        html += '</div>';
                    }

                    // Show protected products
                    if (data.details.protectedFound.length > 0) {
                        html += '<div style="background: #f0fdf4; padding: 15px; border-radius: 8px; margin: 10px 0;"><h3>🛡️ PROTECTED PRODUCTS (Will NOT be deleted):</h3>';
                        data.details.protectedFound.forEach(product => {
                            html += `<div class="result protected">🔒 ${product.title}</div>`;
                        });
                        html += '</div>';
                    }

                    results.innerHTML = html;
                } else {
                    results.innerHTML = `<div class="error">❌ Error: ${data.error}</div>`;
                }
            } catch (error) {
                results.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        async function executeDeletion() {
            if (!confirm('🚨 FINAL WARNING: This will permanently delete all non-fitness products! Continue?')) {
                return;
            }
            
            const results = document.getElementById('results');
            results.innerHTML = '<div style="text-align: center; padding: 20px;">🗑️ Deleting products...</div>';
            
            try {
                const response = await fetch('/api/cleanup-products', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer admin-cleanup-2024',
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    let html = `
                        <div style="background: #f0fdf4; padding: 15px; border-radius: 8px; margin: 10px 0;">
                            <h3>✅ CLEANUP COMPLETED!</h3>
                            <br><strong>Products Deleted:</strong> ${data.summary.deletedSuccessfully}
                            <br><strong>Protected Products:</strong> ${data.summary.protectedFound}
                            <br><strong>Fitness Products Kept:</strong> ${data.summary.productsToKeep}
                        </div>
                    `;

                    // Show deletion results
                    if (data.details.productsDeleted.length > 0) {
                        html += '<div style="background: #fef2f2; padding: 15px; border-radius: 8px; margin: 10px 0;"><h3>📋 DELETION RESULTS:</h3>';
                        data.details.productsDeleted.forEach(result => {
                            const icon = result.status === 'deleted' ? '✅' : '❌';
                            html += `<div class="result ${result.status}">${icon} ${result.title} - ${result.status}</div>`;
                        });
                        html += '</div>';
                    }

                    results.innerHTML = html + '<br><button class="btn success" onclick="window.location.reload()">🔄 Refresh Store</button>';
                } else {
                    results.innerHTML = `<div class="error">❌ Error: ${data.error}</div>`;
                }
            } catch (error) {
                results.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
